<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>HeyChomp iPhone</title>
<!--
  Conceito visual do HeyChomp para iPhone (17/11/2026). Apenas design: nada aqui
  é funcionalidade ou integração real. Renderize com render.sh.
  Parâmetros: ?board=app|widgets|lock&theme=light|dark
  Os personagens vêm direto de Sieghart/Shared/Resources/ProviderAssets.xcassets.
-->
<style>
:root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; --round: "SF Pro Rounded", ui-rounded, -apple-system, sans-serif; }
body.light {
  --canvas: #EDEDF0; --page: #F7F7F7; --card: #FFFFFF; --sep: #E6E6E6; --ink: #1D1D1F; --muted: #595959;
  --edge: 0, 0, 0; --accent: #00945F; --onAccent: #00150C; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05);
  --chomp: #00945F; --rita: #61216D; --ada: #0B6A87; --gantt: #775113; --elinor: #CC5F01; --toni: #2806BF;
  --wall: radial-gradient(120% 70% at 15% 10%, #DCEFE6 0%, transparent 60%), radial-gradient(120% 80% at 90% 85%, #E4DDF5 0%, transparent 60%), linear-gradient(160deg, #F3F1EC, #E9E7F2);
  --lockwall: radial-gradient(90% 60% at 20% 15%, #5FA98C 0%, transparent 65%), radial-gradient(100% 70% at 85% 80%, #7C6FB8 0%, transparent 65%), linear-gradient(170deg, #4E8F7C, #5B5492);
  --wtext: #1D1D1F;
}
body.dark {
  --canvas: #0E0E10; --page: #1E1E1E; --card: #252525; --sep: #343434; --ink: #EDEDED; --muted: #A0A0A0;
  --edge: 255, 255, 255; --accent: #3EDC9A; --onAccent: #04170F; --shadow: 0 1px 0 rgba(255,255,255,.03) inset;
  --chomp: #3EDC9A; --rita: #DB9CF6; --ada: #1497A5; --gantt: #F3E334; --elinor: #CF7B03; --toni: #A96EFC;
  --wall: radial-gradient(120% 70% at 15% 10%, #14352A 0%, transparent 60%), radial-gradient(120% 80% at 90% 85%, #2A2141 0%, transparent 60%), linear-gradient(160deg, #111214, #17151D);
  --lockwall: radial-gradient(90% 60% at 20% 15%, #123B2E 0%, transparent 65%), radial-gradient(100% 70% at 85% 80%, #2B2350 0%, transparent 65%), linear-gradient(170deg, #0B1714, #120F1F);
  --wtext: #EDEDED;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; }
svg { display: block; }

/* Board */
.board { padding: 64px 72px 56px; }
.board-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 48px; }
.board-head h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.board-head p { font-size: 15px; color: var(--muted); margin-top: 6px; max-width: 760px; line-height: 1.45; }
.board-tag { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.board-row { display: flex; gap: 56px; align-items: flex-start; }
.col { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.caption { font-size: 14px; color: var(--muted); text-align: center; max-width: 380px; line-height: 1.4; }
.caption b { color: var(--ink); font-weight: 600; display: block; font-size: 15px; margin-bottom: 2px; }

/* Phone */
.phone { width: 393px; height: 852px; border-radius: 56px; position: relative; overflow: hidden; background: var(--page);
  box-shadow: 0 0 0 11px #0A0A0B, 0 0 0 12.5px #3A3A3D, 0 40px 80px rgba(0,0,0,.18); flex: none; margin: 12px; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 50; }
.island.live { width: 168px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 6px; }
.island.live img { width: 34px; margin-top: 2px; }
.island.live span { color: #DB9CF6; font: 600 14px var(--round); font-variant-numeric: tabular-nums; }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 46px; z-index: 40; font-weight: 600; font-size: 16.5px; color: var(--ink); }
.sb.white { color: #fff; }
.sbi { display: flex; gap: 6px; align-items: center; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; z-index: 60; }
.home-ind.white { background: #fff; }

/* Shared atoms */
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); border: .5px solid rgba(var(--edge), .06); position: relative; }
.perch { position: absolute; width: 88px; top: -44px; left: 12px; pointer-events: none; z-index: 2; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 15px; border-radius: 17px; font: 600 14px var(--font); border: 0; color: var(--ink); background: rgba(var(--edge), .06); white-space: nowrap; }
.pill.primary { background: var(--accent); color: var(--onAccent); }
.pill.big { height: 54px; border-radius: 27px; font-size: 17px; width: 100%; justify-content: center; }
.pill.soon { height: 22px; padding: 0 9px; font-size: 11px; font-weight: 600; color: var(--muted); background: rgba(var(--edge), .06); }
.label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.mark { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.muted { color: var(--muted); }

/* Onboarding */
.ob { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 64px 24px 40px; }
.steps { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.steps i { width: 6px; height: 6px; border-radius: 3px; background: rgba(var(--edge), .15); }
.steps i.on { width: 20px; background: var(--accent); }
.hero { position: relative; height: 330px; margin-top: 18px; }
.hero img { position: absolute; width: 220px; left: 50%; bottom: 0; transform: translateX(-46%); }
.bubble { background: var(--card); color: var(--ink); border-radius: 20px; padding: 13px 16px; font-size: 16px; line-height: 1.38; box-shadow: var(--shadow); border: .5px solid rgba(var(--edge), .07); position: relative; }
.bubble.down { position: absolute; top: 4px; left: 6px; right: 26px; }
.bubble.down::after { content: ""; position: absolute; bottom: -9px; left: 96px; width: 18px; height: 18px; background: var(--card); transform: rotate(45deg); border-radius: 3px; border-right: .5px solid rgba(var(--edge), .07); border-bottom: .5px solid rgba(var(--edge), .07); }
.ob h2 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.12; margin-top: 26px; }
.ob .sub { font-size: 16px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
.field { margin-top: 20px; height: 56px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--accent); display: flex; align-items: center; padding: 0 18px; font-size: 19px; font-weight: 500; }
.caret { width: 2px; height: 24px; background: var(--accent); margin-left: 2px; border-radius: 1px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 10px; padding-left: 4px; }
.spacer { flex: 1; }
.link { display: flex; gap: 8px; align-items: center; justify-content: center; font: 600 15px var(--font); color: var(--ink); background: none; border: 0; margin-top: 16px; height: 34px; }
.team-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; row-gap: 48px; margin-top: 54px; }
.team-card { padding: 26px 14px 14px; text-align: center; min-height: 112px; display: flex; flex-direction: column; align-items: center; }
.team-card .perch { left: 50%; transform: translateX(-50%); width: 84px; top: -42px; }
.team-card .nm { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.team-card .rl { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.team-card .pill.soon { margin-top: 8px; }

/* Home */
.home { position: absolute; inset: 0; padding: 60px 18px 0; }
.home-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 0 4px; }
.home-head .date { font-size: 14px; color: var(--muted); font-weight: 500; }
.home-head h2 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.icon-btn { width: 38px; height: 38px; border-radius: 19px; background: rgba(var(--edge), .06); display: grid; place-items: center; color: var(--ink); }
.team-row { display: flex; justify-content: space-between; margin: 12px 2px 0; }
.av { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 54px; }
.av .ring { width: 50px; height: 50px; border-radius: 25px; border: 2px solid var(--c); padding: 2px; position: relative; }
.av .ring div { width: 100%; height: 100%; border-radius: 50%; background: var(--card); overflow: hidden; display: grid; place-items: center; }
.av .ring img { width: 112%; margin-top: 6px; }
.av .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 7px; border: 2.5px solid var(--page); background: var(--accent); }
.av .dot.idle { background: #9A9A9A; }
.av span { font-size: 11px; font-weight: 600; color: var(--muted); }
.chomp-card { margin-top: 52px; padding: 22px 16px 14px; }
.chomp-card p { font-size: 15.5px; line-height: 1.4; }
.chomp-card .who { font-size: 12px; font-weight: 600; color: var(--muted); position: absolute; top: 10px; left: 106px; }
.row-pills { display: flex; gap: 8px; margin-top: 12px; }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 4px 0; }
.sec a { font-size: 13px; font-weight: 600; color: var(--accent); }
.gantt-card { margin-top: 48px; padding: 20px 16px 14px; }
.ev { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 5px 0; }
.ev time { width: 44px; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.ev .bar { width: 3px; height: 18px; border-radius: 2px; background: var(--c); flex: none; }
.ev.now { font-weight: 600; }
.ev.now time { color: var(--ink); }
.ev .in { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 42px; }
.mini { padding: 22px 14px 14px; min-height: 120px; }
.mini .perch { width: 72px; top: -36px; left: 8px; }
.mini .k { font-size: 12px; font-weight: 600; color: var(--muted); }
.mini .v { font: 700 26px var(--round); letter-spacing: -.01em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.mini .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.track { height: 5px; border-radius: 3px; background: rgba(var(--edge), .08); margin-top: 10px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; background: var(--c); }
.composer-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 30px; background: linear-gradient(to bottom, transparent, var(--page) 34%); }
.composer { height: 56px; border-radius: 28px; background: var(--card); box-shadow: 0 6px 24px rgba(0,0,0,.08); border: .5px solid rgba(var(--edge), .08); display: flex; align-items: center; padding: 0 7px 0 8px; gap: 8px; }
.composer .cbtn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--muted); background: rgba(var(--edge), .05); }
.composer .ph { flex: 1; font-size: 16px; color: var(--muted); }
.mic { width: 42px; height: 42px; border-radius: 21px; background: var(--accent); color: var(--onAccent); display: grid; place-items: center; flex: none; }

/* Chat */
.chat-head { position: absolute; top: 54px; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: .5px solid var(--sep); }
.chat-head .t { display: flex; flex-direction: column; align-items: center; }
.chat-head .t b { font-size: 16px; }
.chat-head .t span { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.msgs { position: absolute; top: 118px; left: 0; right: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
.day { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; margin: 4px 0; }
.me { align-self: flex-end; max-width: 78%; background: var(--accent); color: var(--onAccent); border-radius: 20px 20px 6px 20px; padding: 11px 15px; font-size: 16px; line-height: 1.35; }
.them { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.them .face { width: 30px; height: 30px; border-radius: 15px; background: var(--card); overflow: hidden; display: grid; place-items: center; flex: none; border: .5px solid rgba(var(--edge), .1); }
.them .face img { width: 150%; margin-top: 2px; }
.them .b { background: var(--card); border: .5px solid rgba(var(--edge), .07); box-shadow: var(--shadow); border-radius: 20px 20px 20px 6px; padding: 11px 15px; font-size: 16px; line-height: 1.38; }
.handoff { margin: 30px 0 0 38px; padding: 16px 14px 12px 14px; }
.handoff .perch { width: 66px; top: -33px; left: 8px; }
.handoff .h1 { font-size: 12px; font-weight: 600; color: var(--muted); }
.handoff .h2 { font-size: 15px; font-weight: 600; margin-top: 3px; }
.handoff .h3 { font-size: 13px; color: var(--muted); margin-top: 2px; }
.typing { display: flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 4px; background: var(--muted); opacity: .5; }
.typing i:nth-child(2) { opacity: .75; }
.suggest { display: flex; gap: 8px; flex-wrap: nowrap; margin-bottom: 10px; overflow: hidden; }

/* Home screen (springboard) */
.wall { position: absolute; inset: 0; background: var(--wall); }
.lockwall { position: absolute; inset: 0; background: var(--lockwall); }
.sp { position: absolute; }
.wlabel { position: absolute; font-size: 11.5px; font-weight: 500; color: var(--wtext); opacity: .82; text-align: center; width: 100%; bottom: -19px; }
.w { position: absolute; background: var(--card); border-radius: 23px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.07); }
body.dark .w { box-shadow: none; border: .5px solid rgba(255,255,255,.06); }
.w.s { width: 170px; height: 170px; }
.w.m { width: 364px; height: 170px; }
.w.l { width: 364px; height: 382px; }
.w .top { position: absolute; top: 13px; right: 14px; font-size: 11px; font-weight: 600; color: var(--muted); }
.inner { position: absolute; background: var(--page); border-radius: 15px; }
body.dark .inner { background: #303030; }
.inner .perch { width: 64px; top: -32px; left: 8px; }
.appicons { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 62px); justify-content: space-between; padding: 0 28px; row-gap: 26px; }
.appicons i { width: 62px; height: 62px; border-radius: 14px; background: rgba(255,255,255,.55); display: block; position: relative; }
body.dark .appicons i { background: rgba(255,255,255,.10); }
.appicons i::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -14px; height: 5px; border-radius: 3px; background: var(--wtext); opacity: .2; }
.dock { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 92px; border-radius: 34px; background: rgba(255,255,255,.35); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: space-around; padding: 0 12px; }
body.dark .dock { background: rgba(255,255,255,.08); }
.dock i { width: 62px; height: 62px; border-radius: 14px; background: rgba(255,255,255,.6); }
body.dark .dock i { background: rgba(255,255,255,.12); }
.searchpill { position: absolute; left: 50%; transform: translateX(-50%); height: 30px; padding: 0 14px; border-radius: 15px; background: rgba(255,255,255,.4); font-size: 13px; font-weight: 600; color: var(--wtext); display: flex; align-items: center; gap: 6px; }
body.dark .searchpill { background: rgba(255,255,255,.1); }

/* Lock screen */
.lk-date { position: absolute; top: 76px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.92); font-size: 20px; font-weight: 600; display: flex; justify-content: center; gap: 10px; align-items: center; }
.lk-date .inl { display: flex; align-items: center; gap: 5px; opacity: .92; }
.lk-clock { position: absolute; top: 96px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.95); font: 600 104px/1 var(--round); letter-spacing: -.02em; }
.acc-row { position: absolute; top: 222px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
.acc { color: #fff; }
.acc.c { width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,.16); backdrop-filter: blur(12px); display: grid; place-items: center; position: relative; }
.acc.r { width: 158px; height: 72px; border-radius: 16px; background: rgba(255,255,255,.16); backdrop-filter: blur(12px); padding: 9px 11px; position: relative; overflow: hidden; }
.acc .t1 { font-size: 12px; font-weight: 600; opacity: .8; display: flex; align-items: center; gap: 5px; }
.acc .t2 { font-size: 15px; font-weight: 700; margin-top: 2px; line-height: 1.15; }
.acc .t3 { font-size: 12.5px; opacity: .8; margin-top: 1px; }
.sil { filter: grayscale(1) invert(1) brightness(1.35) contrast(1.05); }
.gauge { position: absolute; inset: 0; }
.gauge-v { font: 700 18px var(--round); line-height: 1; text-align: center; }
.gauge-l { font-size: 10px; font-weight: 600; opacity: .8; text-align: center; margin-top: 2px; }
.notif { position: absolute; left: 10px; right: 10px; border-radius: 24px; background: rgba(255,255,255,.72); backdrop-filter: blur(24px); padding: 13px 14px; display: flex; gap: 11px; color: #111; }
body.dark .notif { background: rgba(40,40,44,.78); color: #eee; }
.notif .ico { width: 38px; height: 38px; border-radius: 9px; background: #111; display: grid; place-items: center; overflow: hidden; flex: none; }
.notif .ico img { width: 46px; margin-top: 8px; }
.notif .nt { flex: 1; font-size: 14.5px; line-height: 1.3; }
.notif .nt b { display: flex; justify-content: space-between; font-size: 14.5px; }
.notif .nt b span { font-weight: 400; opacity: .55; font-size: 13px; }
.la { position: absolute; left: 10px; right: 10px; border-radius: 26px; background: rgba(18,18,20,.82); backdrop-filter: blur(24px); padding: 16px 16px 14px; color: #fff; }
.la .row { display: flex; align-items: center; gap: 12px; }
.la img.p { width: 70px; margin: -10px 0 -4px -4px; }
.la .k { font-size: 13px; font-weight: 600; color: #DB9CF6; }
.la .v { font: 700 34px var(--round); font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.05; }
.la .btns { margin-left: auto; display: flex; gap: 8px; }
.la .rb { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.14); display: grid; place-items: center; }
.la .track { background: rgba(255,255,255,.14); margin-top: 12px; }
.lk-bottom { position: absolute; bottom: 46px; left: 46px; right: 46px; display: flex; justify-content: space-between; }
.lk-bottom i { width: 50px; height: 50px; border-radius: 25px; background: rgba(0,0,0,.22); backdrop-filter: blur(10px); display: grid; place-items: center; color: #fff; }

/* Notes column */
.notes { width: 420px; padding: 28px 28px 24px; margin-top: 12px; }
.notes h3 { font-size: 17px; font-weight: 700; }
.notes ul { list-style: none; margin-top: 12px; display: flex; flex-direction: column; gap: 11px; }
.notes li { font-size: 14px; line-height: 1.45; color: var(--muted); padding-left: 16px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 6px; border-radius: 3px; background: var(--accent); }
.notes li b { color: var(--ink); font-weight: 600; }
.notes .sz { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.notes .sz span:nth-child(odd) { font-weight: 600; }
.notes .sz span:nth-child(even) { color: var(--muted); }
.notes hr { border: 0; border-top: .5px solid var(--sep); margin: 18px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'light';
const board = q.get('board') || 'app';
document.body.className = theme;
const A = '../../../Sieghart/Shared/Resources/ProviderAssets.xcassets/';
const peek = n => A + `Peek-${n}.imageset/peek@2x.png`;
const face = n => A + `Companion-${n}.imageset/portrait@2x.png`;
const dark = theme === 'dark';

// Glyphs drawn here (not SF Symbols) so the board renders anywhere.
const I = {
  mic: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="currentColor"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  plus: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  spark: (s, c = 'currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2c.8 6 4 9.2 10 10-6 .8-9.2 4-10 10-.8-6-4-9.2-10-10 6-.8 9.2-4 10-10z" fill="${c}"/></svg>`,
  back: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  person: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4" fill="currentColor"/><path d="M4.5 20.5c1-4 4-6 7.5-6s6.5 2 7.5 6z" fill="currentColor"/></svg>`,

        <li><b>Linha do que está acontecendo:</b> as etapas sobem e somem (✓ feito → atual em negrito), como um pensamento em voz alta.</li>
        <li><b>Selo menta de “digitando”</b> mostra quem está trabalhando agora.</li>
        <li><b>Marca do Chomp:</b> cápsula menta com os dois olhos; serve para a ilha, o acessório circular e a Live Activity.</li>
        <li><b>Encerrar em vermelho</b> é a única cor fora da paleta, como no padrão de chamada do iOS.</li>
      </ul><hr><h3>Referências (só estrutura)</h3><ul>
        <li>Grok Bot: widget de rosto com status, grade da equipe e voz na Dynamic Island.</li>
        <li>OpenBot.run: quadro de agentes com tarefas em andamento.</li>
      </ul></div>
    </div></div>`,
  app: () => `<div class="board">${head('App: primeiro uso, início e conversa', 'Mesma linguagem do Mac: janela quieta, personagens expressivos. O Chomp fala em balões, as ações são pílulas e cada agente espia por cima do cartão que é dele.')}
    <div class="board-row">
      ${col(onboardingName(), '1 · Boas-vindas', 'O Chomp se apresenta num balão e pergunta o nome. Opção para parear com o Mac.')}
      ${col(onboardingTeam(), '2 · Conheça a equipe', 'Seis cartões com o personagem espiando. O que ainda não existe aparece como “em breve”.')}
      ${col(homeScreen(), '3 · Início', 'Sugestão do Chomp no topo, status da equipe, agenda do Gantt, foco da Rita e o mês da Elinor. A barra de pergunta (voz ou texto) fica sempre embaixo.')}
      ${col(chatScreen(), '4 · Conversa', 'O Chomp responde e mostra o que repassou: cada repasse vira um cartão com o agente espiando.')}
    </div></div>`,
  widgets: () => `<div class="board">${head('Widgets da tela de início', 'Pequeno, médio e grande. O widget corta tudo o que passa da borda, então o personagem espia por cima de um elemento interno (campo, cartão ou botão), nunca da moldura.')}
    <div class="board-row">
      ${col(homeA(), 'Perguntar, focar e agenda', 'Médio “Pergunte ao Chomp” (texto ou voz), pequeno de foco da Rita, pequeno “Falar” e médio da agenda do Gantt. No topo, a Live Activity do foco na Dynamic Island, como a ilha no notch do Mac.')}
      ${col(homeB(), 'Equipe', 'Grande com o status de cada agente e a pergunta ao Chomp no rodapé. Pequenos: próximo evento (Gantt) e área de transferência (Toni).')}
      <div class="card notes"><h3>Regras dos widgets</h3><ul>

        <li><b>Personagem sempre apoiado</b> numa borda interna, nunca flutuando solto.</li>
        <li><b>Em breve:</b> Saúde da Rita e Apple Pay da Elinor não aparecem nos widgets até existirem.</li>

        <span>Pequeno</span><span>170 × 170 pt · Chomp Falar, Rita Foco, Gantt Próximo, Toni Área</span>
        <span>Médio</span><span>364 × 170 pt · Pergunte ao Chomp, Agenda do Gantt</span>
        <span>Grande</span><span>364 × 382 pt · Equipe</span>

  lock: () => `<div class="board">${head('Tela bloqueada', 'Acessórios monocromáticos: o iOS pinta tudo de uma cor só, então os personagens viram silhuetas claras com os olhos vazados. Notificações e Live Activity mantêm as cores.')}
    <div class="board-row">
      ${col(lockA(), 'Circulares + em linha', 'Em linha acima do relógio: próximo compromisso. Circulares: Falar com o Chomp, foco da Rita (anel), próximo evento do Gantt e equipe ativa. Abaixo, notificações com o personagem no ícone.')}
      ${col(lockB(), 'Retangulares + Live Activity', 'Retangular “Pergunte ao Chomp” (voz ou texto) e próximo evento do Gantt. Embaixo, a Live Activity do foco da Rita com pausar e encerrar.')}
      <div class="card notes"><h3>Acessórios</h3><div class="sz" style="margin-top:12px">
        <span>Em linha</span><span>Uma linha acima do relógio: ✦ + próximo compromisso ou o foco</span>

      </div><hr><h3>Por que assim</h3><ul>
        <li><b>Voz em um toque</b>, como nos atalhos de voz dos apps de IA: o circular “Falar” abre o app já ouvindo.</li>
        <li><b>Silhuetas reconhecíveis:</b> o brilho do Chomp, o capacete do Gantt e os óculos da Rita continuam legíveis em uma cor.</li>
        <li><b>Live Activity = a ilha do Mac.</b> O foco da Rita aparece na Dynamic Island e na tela bloqueada.</li>
